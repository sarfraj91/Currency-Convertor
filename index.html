<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <title>Currency Convertor</title>
  </head>
  <body>
    <div class="container">
      <h2>Currency Convertor</h2>
      <form action="">
        <div class="amount">
        
          <input type="text" name="" id="amount" placeholder="Enter Amount" />
        </div>
        <div class="dropdown">
          <div class="from">
            <p>From</p>
            <div class="select-container">
              <img src="https://flagsapi.com/US/flat/64.png" alt="" />
              <select name="From" id="">
                <option value="INR">INR</option>
                <option value="USD" selected>USD</option>
                <option value="EUR">EUR</option>
                <option value="AUD">AUD</option>
              </select>
            </div>
          </div>
          <i class="fa-solid fa-arrow-right-arrow-left"></i>

          <div class="to">
            <p>TO</p>
            <div class="select-container">
              <img src="https://flagsapi.com/IN/flat/64.png" alt="" />
              <select name="From" id="">
                <option value="INR" selected>INR</option>
                <option value="USD" >USD</option>
                <option value="EUR">EUR</option>
                <option value="AUD">AUD</option>
              </select>
            </div>
          </div>
          
        </div>
        <p class="msg">1 USD=100 INR</p>
        <button class="btn">Exchange</button>
      </form>
    </div>
    <script src="code.js"></script>
    <script src="index.js"></script>
  </body>
</html>
